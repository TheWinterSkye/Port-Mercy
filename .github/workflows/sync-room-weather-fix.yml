name: Sync Port Mercy room and weather fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply room, NPC, and weather fixes
        run: python .github/scripts/sync_room_weather.py
      - name: Commit source changes
        run: |
          rm -f .github/workflows/sync-room-weather-fix.yml .github/scripts/sync_room_weather.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Mercy Fuel rooms and synced weather boundaries"
          git push
